# Lint config for the GridSentry API. Run: npm run lint:api
line-length = 120
target-version = "py310"
exclude = [".venv"]

[lint]
# pycodestyle errors, pyflakes, import order, bugbear, unused arguments, and
# pyupgrade (PEP 604 `X | None` annotations, modern typing imports).
select = ["E4", "E7", "E9", "F", "I", "B", "ARG", "UP"]

[lint.per-file-ignores]
# Test doubles must mirror the signatures they replace.
"tests/*" = ["ARG001", "ARG002"]
# main.py loads .env before importing modules that read those variables.
"main.py" = ["E402"]
