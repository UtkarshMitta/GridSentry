# Render blueprint for the GridSentry FastAPI backend.
# Deploy: https://dashboard.render.com  →  New  →  Blueprint  →  pick this repo.
# Render supports long-lived Server-Sent Events, which the live agent
# progress stream depends on (Vercel serverless functions do not).
services:
  - type: web
    name: gridsentry-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin the Python runtime so deploys are reproducible. The test suite
      # passes on 3.12 and 3.14 (pydantic 2.12 ships wheels for 3.14).
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional — adds web sources on the state's wetland program. Jurisdiction
      # verification itself uses the keyless U.S. Census geocoder.
      # Set values in the Render dashboard; do not commit keys.
      - key: TAVILY_API_KEY
        sync: false
      # Optional — enables a real LLM for the agent narratives (see
      # apps/api/.env.example for the model overrides).
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
